inherit_from: .rubocop_todo.yml

require:
  - ./.rubocop/class_length_ceiling.rb

AllCops:
  TargetRubyVersion: 3.3
  DisabledByDefault: true
  SuggestExtensions: false
  Exclude:
    - "smoke/**/*"
    - "sample/**/*"
    - ".gem_rbs_collection/**/*"
    - "lib/steep/parser.rb"
    - "coverage/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

Metrics/MethodLength:
  Enabled: true
  CountAsOne: ["array", "hash", "heredoc", "method_call"]
  Max: 20

# Replaced by Project/ClassLengthCeiling, which takes the same settings plus a
# per-file ceiling.
Project/ClassLengthCeiling:
  Enabled: true
  CountAsOne: ["array", "hash", "heredoc", "method_call"]
  Max: 400
  Ceilings:
    "test/type_construction_test.rb": 5973
    "lib/steep/type_construction.rb": 3884
