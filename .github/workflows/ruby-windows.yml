name: Run test on Windows

# Manual only: `herb`, which the fork depends on for ERB, does not build on
# Windows (`sys/mman.h`), so the job cannot get past `bundle install`.
on:
  workflow_dispatch: {}

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        ruby_version:
        - "3.3"
        - "3.4"
        - "4.0"
        task:
        - test
        # - test:output  Ignored because the order of diagnostics changes somehow
        - build
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby_version }}
    - name: Run test
      run: |
        git config --global --add safe.directory /__w/steep/steep
        ruby -v
        gem install bundler
        bundle config --global with development
        bundle install --jobs 4 --retry 3
        bin/setup
        bundle exec rake ${{matrix.task}}
