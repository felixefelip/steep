name: Run test on container

on:
  push:
    branches:
      - master
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
        task:
          - test
          - test:output
          - build
        # The unit suite takes 9–13 minutes per Ruby; run it on 4.0 only.
        exclude:
          - ruby: '3.3'
            task: test
          - ruby: '3.4'
            task: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler: none
    - name: Fix permission
      run: |
        gem env gemdir
        chmod 775 `gem env gemdir`/gems
    - name: Run test
      run: |
        git config --global --add safe.directory /__w/steep/steep
        ruby -v
        gem install bundler
        bundle config --global with development
        bin/setup
        bundle exec rake ${{matrix.task}}
  type_check:
    # Off until the fork's own code is declared in sig/steep: upstream Steep
    # reports ~2.5k errors, nearly all from fork-only files with no RBS.
    if: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "4.0"
        bundler: none
    - name: Fix permission
      run: |
        gem env gemdir
        chmod 775 `gem env gemdir`/gems
    - name: Type check
      run: |
        git config --global --add safe.directory /__w/steep/steep
        ruby -v
        gem install bundler
        bin/setup
        bin/steep check --validate=library --severity=error
  diagnostics:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "4.0"
        bundler: none
    - name: Fix permission
      run: |
        gem env gemdir
        chmod 775 `gem env gemdir`/gems
    - name: Run generator
      run: |
        git config --global --add safe.directory /__w/steep/steep
        ruby -v
        gem install bundler
        bin/setup
        bundle exec ruby bin/generate-diagnostics-docs.rb
        git diff --exit-code HEAD -- manual
  test_rbs_check:
    # Off for now: it fails whenever a test gains a method and the rbs-inline
    # output under sig/test is not regenerated alongside.
    if: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "4.0"
        bundler: none
    - name: Fix permission
      run: |
        gem env gemdir
        chmod 775 `gem env gemdir`/gems
    - name: Check generated RBS files are up to date
      run: |
        git config --global --add safe.directory /__w/steep/steep
        ruby -v
        gem install bundler
        bin/setup
        bundle exec rake rbs:generate
        git diff --exit-code HEAD -- sig/test

